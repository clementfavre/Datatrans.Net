# Publishes the package to nuget.org when a version tag is pushed, for example v0.1.0
# Setup: a trusted publishing policy on nuget.org (owner, repository, workflow file release.yml)
# and the repository secret NUGET_USER with the nuget.org profile name
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # OIDC token exchanged for a short-lived NuGet API key

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version="$VERSION"

      - name: Test
        run: dotnet test --no-build --configuration Release
        env:
          Datatrans__MerchantId: ${{ secrets.DATATRANS_MERCHANT_ID }}
          Datatrans__Password: ${{ secrets.DATATRANS_PASSWORD }}
          Datatrans__CardAlias: ${{ secrets.DATATRANS_CARD_ALIAS }}
          Datatrans__CardExpiryMonth: ${{ secrets.DATATRANS_CARD_EXPIRY_MONTH }}
          Datatrans__CardExpiryYear: ${{ secrets.DATATRANS_CARD_EXPIRY_YEAR }}
          Datatrans__SubMerchantId: ${{ secrets.DATATRANS_SUB_MERCHANT_ID }}

      - name: Pack
        run: dotnet pack src/Datatrans.Net/Datatrans.Net.csproj --no-build --configuration Release -p:Version="$VERSION" --output artifacts

      # Requested right before the push, the key is only valid for one hour
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # The .snupkg next to the .nupkg is pushed with it
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
